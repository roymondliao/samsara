schema_version: 2
id: "<stable module id>"

interfaces:
  - name: "<public API, command, event, or exported symbol>"
    node: "<node id>"
    evidence_refs:
      - "<path#symbol or path:line>"

nodes:
  - id: "<path or path#symbol>"
    kind: "<file | function | class | interface | command | config | schema>"
    path: "<repository-relative path>"
    responsibility: "<what this node does | unknown>"
    provides:
      - "<capability, interface, data, or command>"
    evidence_refs:
      - "<path#symbol or path:line>"

internal_relationships:
  - from: "<node id>"
    to: "<node id>"
    type: "<contains | imports | calls | implements | configures | reads | writes | emits | consumes>"
    evidence_refs:
      - "<path#symbol or path:line>"

rot_risks:
  - id: "<stable module-local risk id>"
    failure_level: 1  # 1 visible | 2 disguised | 3 false success | 4 silent rot
    description: "<what fails and how it stays hidden>"
    confidence: medium  # high | medium | low
    evidence_refs:
      - "<path#symbol or path:line>"

hidden_coupling:
  - id: "<stable module-local coupling id>"
    type: "<shared-table | shared-config | event-bus | shared-filesystem | implicit-ordering>"
    with_node: "<node id or coverage-gap path>"
    risk: "<what breaks silently when either side changes>"
    confidence: medium  # high | medium | low
    evidence_refs:
      - "<path#symbol or path:line>"

assumptions:
  - statement: "<what the code assumes>"
    status: unverified  # verified | unverified
    evidence_refs:
      - "<path#symbol or path:line>"
