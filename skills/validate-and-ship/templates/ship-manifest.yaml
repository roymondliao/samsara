# Ship Manifest — current write contract
# Write to: changes/<feature>/ship-manifest.yaml
# The LLM is the sole writer. Keep refs stable; do not restate source artifacts.

feature: <feature-name>

delivered_capability:
  summary: "<one concise sentence>"
  source_refs: []  # PT-*, PL-D*, or AC-* IDs

snapshot:
  base_commit: <git-sha>
  candidate_commit: <last_commit from the iteration_entry mapping in index.yaml>

validation_status: in_progress  # in_progress | ready_for_delivery | blocked

validation:
  security_privacy:
    status: unknown  # pass | accepted_risk | fail | unknown
    scope_ref: "<base-commit>...<candidate-commit>"
    evidence_refs: []
    accepted_risks: []
    # Human-only accepted-risk form:
    # - finding_ref: "<review evidence pointer>"
    #   rationale: "<why shipping with this exposure is acceptable>"
    #   re_review_signal: "<observable trigger>"
    #   owner: "<who notices and acts>"

  remaining_exposure:
    status: unknown  # pass | blocked | unknown
    accepted_refs: []  # scar-reports/<file>#SC-N
    deferred_refs: []
    open_refs: []
    blocked_refs: []

  acceptance:
    status: unknown  # pass | fail | unknown
    scenario_results: []
    # - scenario_ref: AC-N
    #   status: pass  # pass | fail | unknown
    #   evidence_refs: ["<test, command output, or file pointer>"]

  primary_evaluator:
    evaluator_ref: PT-EVAL
    status: unknown  # pass | fail | unknown
    evidence_refs: []

  e2e:
    status: unknown  # pass | fail | not_applicable | unknown
    evidence_refs: []

  reconciliation:
    status: unknown  # pass | fail | unknown
    drift: []
    # - source_ref: <PT-*, PL-D*, or AC-*>
    #   disposition: <accepted | unresolved>
    #   evidence_refs: []
    #   decision_ref: <human decision or auto-decisions.md anchor | null>

  review_evidence:
    status: unknown  # pass | fail | unknown
    evidence_refs: []  # both Yin and Quality entries in review-record.md

operational_controls:
  monitoring:
    status: unknown  # available | absent | not_applicable | unknown
    mechanism: null
    evidence_refs: []
  rollback_or_disable:
    status: unknown  # available | absent | not_applicable | unknown
    mechanism: null
    evidence_refs: []

delivery:
  action: pending  # pending | merge | create_pr | keep_branch | discard
  selected_by: null  # human | auto-gatekeeper | null
  decision_ref: null  # required for auto-gatekeeper
  preparation: []  # commands or instructions only; this skill does not execute them
