feature: <feature-name>
status: pending
iteration_entry: null
# Iteration owns this checkpoint. It replaces null with:
# status: <in_progress | ready_for_validation | blocked>
# route: <skip_rounds | fix_rounds | unknown>
# round: <N>
# evaluator: <pass | fail | unknown>
# signal_lost: <unresolved scar count proxy>
# stagnation_count: <N>
# reason: <evidence-backed one-line result>
# last_commit: <git SHA | null>
# reversible: true

sources:
  pre_thinking: pre-thinking.md
  plan: 2-plan.md
  acceptance: acceptance.yaml
  overview: overview.md

tasks:
  - id: task-1
    task_file: tasks/task-1.md
    title: "<task description>"
    status: pending
    scar_count: null
    unresolved_assumptions: null
    planning_refs: [PL-D1]
    decision_refs: [PT-D1, PT-S1]
    acceptance_refs: [AC-1]
    depends_on: []
    seam: <semantic-name | null>
    affects: []
    anchors: []
    # When needed: {path: <live/interface/file>, why: <contract to preserve>}.
    # Anchors are read-first starting points, never a whitelist.
