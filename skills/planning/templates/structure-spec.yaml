# Structure Spec Schema — planning-owned template (same convention as
# scar-schema.yaml: schema lives in templates/, instances live in changes/).
#
# Instance path: changes/<feature>/structure-spec.yaml. Generated ONLY by the
# planning skill (SKILL.md Step 2.75); not hand-edited outside planning/iteration.

feature: <feature-name>
spec_path: default          # default | exempt_poc

# exempt_poc shape: kickoff carried an unexpired poc_death_date (see SKILL.md
# Spec-Path Guard). Write ONLY these two fields below — no modules/patterns/
# dependency_rules — and re-check the date every planning pass:
#   poc_death_date: "YYYY-MM-DD"
#   exemption_note: "<why this is a genuine throwaway POC>"

modules:
  - id: SS-1                # unique id — referenced by task structure_refs,
                             # reviewer verdicts, and drift items
    name: <module-name>
    responsibility: "<one sentence>"
    boundary_rationale: "<what existing/planned change gets more expensive if this boundary disappears>"
    evidence:
      type: git_history      # git_history | planned_task | domain_boundary
      ref: "<repo path (git_history) | index.yaml task id (planned_task)>"
      machine_verifiable: true  # MUST be false for domain_boundary
      note: "<one line>"

  # domain_boundary example: no `ref` (nothing to parse); machine_verifiable
  # is explicitly false — a domain boundary is never machine-verified, only
  # rationale-checked (boundary_rationale non-empty is the sole machine check).
  - id: SS-2
    name: <module-name>
    responsibility: "<one sentence>"
    boundary_rationale: "<domain reason this split exists>"
    evidence:
      type: domain_boundary
      machine_verifiable: false
      note: "<one line — reviewer/human judges plausibility, the machine does not>"

patterns:
  - id: SP-1
    pattern: "<pattern name>"
    serves_change_reason: "<change reason this pattern serves>"
    evidence: { type: git_history, ref: "<repo path>", machine_verifiable: true, note: "<one line>" }

dependency_rules:
  - id: SD-1
    rule: "<dependency direction constraint, one sentence>"
    evidence: { type: planned_task, ref: "<index.yaml task id>", machine_verifiable: true, note: "<one line>" }

# --- Evidence resolution: three states, mirrors scar-schema.yaml Rule 9
# systemic_ref semantics (a dangling ref is a parse failure, never skipped) ---
#
#   resolved — git_history ref exists in the repo / planned_task ref exists
#              as a task id in index.yaml
#   failure  — ref does not exist (dangling): a PARSE FAILURE, list file+id,
#              never silently skipped
#   unknown  — the parse basis itself is unreadable (e.g. index.yaml missing
#              or corrupt): mark unknown, pass through the gate, never
#              silently counted as resolved or dropped
