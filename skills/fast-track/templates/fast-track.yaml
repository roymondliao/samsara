type: fast_track
status: completed  # completed | escalated
description: "<one-sentence bounded change>"
source_refs: []  # debugging handoff refs when applicable

entry:
  authority: "<explicit invocation | user confirmation | debugging handoff>"
  risk_evidence:
    - claim: "<why the change is bounded and low risk>"
      evidence_ref: "<file:line, command output, or debugging artifact ref>"
  affected_surfaces:
    - path: "<repository-relative path>"
      role: "<why this surface is affected>"
  structural_impact: none  # none | present | unknown
  unknowns: []

acceptance:
  - "<observable acceptance criterion>"

death_evidence:
  clause: "<if ___ happens, this change failed>"
  pre_change:
    command: "<existing or new deterministic check>"
    result: "<observed failing result before implementation>"

verification:
  - command: "<verification command>"
    result: "<observed result>"

review:
  domains: ["<code | iac>"]
  reference_refs:
    - "<references/<domain>-review.md or references/<domain>-quality.md>"
  evidence_refs:
    - "<file:line>"
  findings: []
  unknowns: []

files_changed:
  - "<repository-relative path>"

escalation:
  route: null  # null | research
  reason: null
