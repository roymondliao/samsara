# Scar Report — Current Write Contract
# Inject this file verbatim into implementer and iteration-fix prompts.
# Write to: changes/<feature>/scar-reports/task-N-scar.yaml

# --- Rules ---
#
# write-filter: before writing a scar, ask whether a future reader would
#   change their action because of it. Empty lists are valid after inspection;
#   never invent or inflate a scar to avoid an empty report.
#
# direct-bullets: write one actionable fact per YAML bullet. Put the result first
#   and name the concrete trigger and location. Do not mix rationale,
#   review history, or verification detail into item text.
#
# Budget — field ≤200 chars (where ≤120) | item ≤6 lines | narrative
#   ≤10 lines | report ≤90 lines. Capped fields: what, bites_when, where,
#   accepted_because, resolution, assumption, and note. Structural entries
#   have their own ≤10 lines-per-entry budget.
#
# legacy-invalid: new known_shortcuts and silent_failure_conditions items
#   use what/bites_when/where slots, not description blobs or bare strings.
#
# verified-pointer: with verified: true, keep assumption to a single line and
#   note to an evidence pointer (file:line or test name). Without a pointer,
#   use verified: false and state the consequence briefly.
#
# resolved-in-place: a fixed item keeps its original slots and adds
#   `status: resolved` plus a one-line `resolution`. Do not copy it elsewhere.
#
# no-review-diary: omit narrative unless the slots cannot carry necessary
#   scar context. Never use it for round-by-round or review-round history.
#
# granularity-floor (granularity floor): structural_decisions records only a
#   pattern, boundary, seam decision, or explicit refusal to abstract.
#   Function splitting, naming, and ordinary control flow are not structural bets. Use
#   `structural_decisions: []` when no structural bet was made.
#
# dual-face: each structural decision includes forced_by plus refused and
#   risk_if_wrong. One face without the other is not a complete record.
#
# forced-by-evidence: forced_by cites evidence that existed at decision time:
#   an affects entry, git/file ref, or declared seam. This prevents post-hoc
#   rationalization. Use pointers, not prose.
#
# systemic-ref: for a recurring cross-feature fact, write systemic_ref plus
#   one note naming this task's concrete landing point. Do not copy the
#   registry description. Resolution lives in skills/iteration/SKILL.md.
#
# go-elsewhere:
#   - review verdicts and round history -> review-record.md
#   - verification details -> test name or file:line pointer
#   - before/after counts -> commit message
#   - recurring cross-feature fact -> systemic_ref

# --- Schema ---

task_id: task-N
completion_status: done
known_shortcuts: []
silent_failure_conditions: []
assumptions_made: []
debt_registered: false
debt_location: null
structural_decisions: []

# completion_status:
#   done = tests pass and no unverified assumption affects correctness
#   done_with_concerns = tests pass but an unverified assumption may matter
#   blocked = an external dependency prevents completion

# --- Optional Item Forms ---
# Use only the fields that apply. Do not copy every form into every report.
#
# known_shortcuts / silent_failure_conditions:
#   - what: "one concrete scar"
#     bites_when: "the trigger that makes it matter"
#     where: "file:line or section pointer"
#     accepted_because: "omit unless acceptance changes a future action"
#     deferred_to_feature_iteration: true
#
# resolved item (alternative to deferred; never use both):
#   - what: "one concrete scar"
#     bites_when: "the trigger that made it matter"
#     where: "file:line or section pointer"
#     status: resolved
#     resolution: "the change made"
#
# systemic item:
#   - systemic_ref: <id>
#     note: "this task's landing point"
#
# assumption:
#   - assumption: "what was assumed"
#     verified: true
#     note: "test name or file:line"
#     deferred_to_feature_iteration: false
#
# narrative: |  # optional; omit when structured fields are sufficient
#   Necessary context only.
#
# structural decision:
#   - decision: "the structural choice"
#     serves_seam: "<seam-name>"  # or null for an evidenced refusal
#     forced_by:
#       - "affects task-N: <planned need>"
#     refused: "what was deliberately not built"
#     risk_if_wrong: "what breaks or must be reworked"

# --- Verbatim Example ---
#
# task_id: task-2
# completion_status: done_with_concerns
# known_shortcuts:
#   - what: "Sort order follows insertion order"
#     bites_when: "a caller expects alphabetical order"
#     where: "scripts/paper_scan.py:88"
# silent_failure_conditions: []
# assumptions_made:
#   - assumption: "topic folders match [0-9]{2}_*"
#     verified: true
#     note: "tests/test_paper_scan.py::test_folder_pattern"
# debt_registered: true
# debt_location: "scripts/paper_scan.py:88"
# structural_decisions: []
