  - "validate_format.py 於每次 implement handoff 強制執行（SKILL.md step 18，缺輸出 = visible missing）— 預算/格式回歸的常設攔截點"
  - "22 個 doc-contract death tests（noise-rules）＋ 14+ validator 行為測試＋三代聚合測試，隨 uv run pytest tests/ 每次全跑"
  - "數值/欄位名雙向防漂移測試：schema 預算表與 validator 常數任一側單獨改動即紅"

kill_switch: "git revert fea676b（單一 commit，內含全部 35 檔變更）。半退場：僅移除 validator 新檢查（刪 _check_length_budget/_check_legacy_form/_check_required_slots 三函式與其測試）可保留新 schema 格式但撤掉硬 gate；讀取端三代相容為 additive，舊 report 不受任何退場影響。"
