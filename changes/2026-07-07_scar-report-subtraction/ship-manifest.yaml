known_failure_modes:
  - mode: "anti-dup death test 只比對 6 個逐字 literal token — compat 內容被改寫措辭貼回 schema 時測試保持綠，單一源在語意上再度分裂"
    severity: silent_corruption
    detection: "無自動偵測（語意比對非 regex 可及）；durable guard 是任何人讀 schema 發現殘留即刪（eb4ae07 先例）＋ per-task review 的 DRY 檢查"
  - mode: "具名錨點被改名而跨檔引用未同步 — dangling-citation death test 只擋數字引用，不擋錨點改名"
    severity: silent_corruption
    detection: "test_unit__rewritten_citations_name_the_correct_anchor 可抓引用點的錨點消失（但抓不到改成另一個仍有效字串）"
  - mode: "iteration Step 1 世代識別文字與未來真實 aggregator 行為漂移（synthetic reader 是 doc 的鏡像，不是 runtime）"
    severity: silent_corruption
    detection: "doc-contract 測試守文字存在；runtime 服從屬 systemic_ref doc-vs-runtime-obedience 的固有限制，靠 review 抽查"
  - mode: "YAML 多文件分隔符（---/...）的 report 對 compose() 行為未測，行數計算可能失真"
    severity: degradation
    detection: "schema 範例與現存 report 皆不使用；若出現，validator 的 char cap 仍為兜底"
  - mode: "dist/ 內 md 檔經 rules 引擎改寫，無法 byte-diff 驗證 — converter 對新 schema 內容的非預期改寫只能靠 integration 測試攔截"
    severity: degradation
    detection: "tests/integration 套件＋samsara-cli validate 的 live-surface 掃描"

accepted_risks:
  - risk: "北極星脫鉤情境：validator 全綠但內容位移到 commit message/task log 以繞過預算（corruption signature），或 clean-scar 反模式率上升"
    accepted_by: "human（kickoff corruption_signature 條款）+ decision-007 accept_gap"
    re_review_signal: "validate-and-ship 主觀抽查發現 report 讀不懂但 validator 綠；或同 feature 內 scar 條目數驟降而 diff 規模不變"
    owner: "下一個 feature 的 validate-and-ship 執行者（Failure Budget Review 段）"
  - risk: "task-5 golden 逐列語意分類（真疤 vs 辯護文）為 judgment，未機械驗證（verified: false 假設）；首版對照表審計宣稱曾出錯（已修，見 review-record）"
    accepted_by: "human（decision-002 明定 golden 為 supporting artifact 非 Primary 的原因）"
    re_review_signal: "任何人追溯 golden-re-expression.md 某列發現原文真疤被錯分類為刪除項"
    owner: "發現者所在 session 的主 agent（對照表逐列可追溯性即偵測面）"
  - risk: "budget 閾值（≤90/≤6/≤200 等）校準自 25 份歷史 report，若未來任務型態改變導致誠實內容裝不下（kill-condition #3）需上修"
    accepted_by: "human（kickoff must-have death condition）"
    re_review_signal: "implementer 回報 BLOCKED with 具體條目與所需行數；或 reviewer 在 ≥2 個 feature 抓到壓縮導致的誠實損失"
    owner: "當次 feature 的主 agent（走 kill-condition #3 重校準路徑並記錄）"

silent_failure_surface: medium  # 5 個 unique remaining silent_failure_conditions（3-7 區間）

