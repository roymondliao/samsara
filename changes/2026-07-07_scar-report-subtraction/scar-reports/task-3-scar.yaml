    risk_if_wrong: "每次對本 feature-dir 跑 validator 都會持續回報 task-1 scar 為 legacy-form/over-budget，直到有人機械遷移它；若遷移被跳過，task-6 整合驗證會在那一步不乾淨地曝光，而非靜默通過"
