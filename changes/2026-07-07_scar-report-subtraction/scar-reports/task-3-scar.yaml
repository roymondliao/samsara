    serves_seam: "format-vs-judgment"
    forced_by:
      - "git: changes/2026-07-07_scar-report-subtraction/tasks/task-3.md:9（validator 只跑單一 feature-dir、無全歷史掃描，故可嚴格不需 grandfather）"
