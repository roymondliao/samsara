structural_decisions:
  - decision: "以既有 grep/regex doc-contract 死亡測試模式擋懸空數字引用，不建 schema-aware 的錨點驗證器（解析 scar-schema.yaml 的錨點清單並逐一比對每個 citation 是否可解析）"
    serves_seam: null
    forced_by:
      - "seam: scar-write-contract — （L1）scar-schema.yaml 是文件而非可解析 API，本測試檔既有的所有防線都是 grep/regex 形式，非 parser"
      - "git: tests/test_skills/test_scar_schema_noise_rules.py — 既有多個同類 grep/regex 死亡測試先例（`grep -cE '^def test_(death|unit)__'` 實測 22 個），未曾用 parser-based 驗證"
    refused: "不建一個讀取 scar-schema.yaml 錨點清單、逐一核對每個 'schema <anchor>' citation 是否可解析的驗證器——目前只有一個消費者（本次 sweep），且數字-缺席 + 名稱-存在 兩個測試已涵蓋當前實際需要防的兩種失效形狀（懸空編號、citation 被整段刪除）"
    risk_if_wrong: "若未來有人改名或刪除具名錨點卻沒同步 grep 這些引用點，除了人工 review 沒有機制擋下——即上面 silent_failure_conditions 記錄的殘餘風險"
