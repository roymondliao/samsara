narrative: |
  Refusal recorded (Structural Honesty mandate): tests/fixtures/source/ 沒有
  新增整個 skills/planning 目錄鏡像，只在既有 fixtures/source/skills/implement/
  下新增單一檔案 templates/structure-spec.yaml。理由：fixture source 樹本身是
  刻意精簡的「轉換機制」測試集（4 個 skill，涵蓋 SKILL.md-only 與
  SKILL.md+companion.md 兩種形狀），本 task 需要驗證的死法（I2：新 template
  在 nested templates/ 目錄下被靜默丟棄）是一個可泛化的機制性問題，不需要
  逐一鏡像 planning skill 的全部內容才能驗證——那會是為單一消費者
  （這一個死法測試）建一整套平行的 fixture skill，屬 speculative
  generality。若未來出現第二個明確理由（例如需要驗證 planning skill
  本身的轉換輸出內容，而不只是「nested yaml companion 存活」這個機制），
  屆時再擴充 fixture source 的 planning skill 鏡像。

  真實供應鏈（非 fixture）驗證結果：`samsara-cli convert --platform codex`
  與 `--platform gemini-cli` 對真實 skills/ 樹跑一次，確認
  `skills/planning/templates/structure-spec.yaml` 與
  `skills/iteration/templates/iteration-log.yaml`（task 1/4 的實際新增/修改
  template）都出現在 dist/codex 與 dist/gemini-cli 的對應輸出路徑，內容與
  來源一致。`samsara-cli validate --platform codex --source dist/codex` 與
  `--platform gemini-cli --source dist/gemini-cli` 均回報 0 error——真實
  轉換輸出本身是乾淨的，I2 的死法在真實供應鏈上沒有發生。
