    note: "ship-manifest.md rule 2 + iteration SKILL.md accept format require re_review_signal/owner in prose only; no runtime watcher polls for the named signal firing, and nothing blocks an author from writing an empty/placeholder value in either field."

  - description: "Negation-detection windows in the test file's step2_accept_requires_signal / step2_accept_requires_expiry (fixed 20-char trailing) and yin_declares_accept_requires_signal (fixed 30-char trailing) are NOT clause-bounded to the sentence's actual end punctuation, because the real Yin-Side bullet is one long em-dash/semicolon-joined compound sentence containing unrelated negations ('risk acceptance is not permanent', 'never rings') that would false-negative the correct doc if the window extended that far. I tried an alternative during self-iteration (bounding the window to the nearest em-dash/semicolon/sentence-end instead of a fixed char count) and verified by direct trace that it does NOT close the gap — it only relocates it: a decoy placing its negation just past an em-dash boundary (`... — but this field is not actually required ...`) still slips past the em-dash-bounded window the same way a fixed-width window misses a distant negation. This is an irreducible category of heuristic residual for a doc-presence regex, not an oversight; task-1's scar (index.yaml: 'negation distant >40 chars can still fool carrier predicate') already established the same precedent and accepted it rather than chasing it with more regex complexity."
    # accepted, not fixed — verified during self-iteration that the "improved"
    # alternative has an equivalent-class gap, so widening the window is not
    # actually a fix, just a different blind spot in the same shape.

  - description: "quality review 建議項（accepted, not fixed）：「no mechanism ever read expiry / alarm clock never rings」的理由句在 ship-manifest.md rule 2 與 iteration SKILL.md Yin bullet 各自完整出現一次（DRY）。不修的理由：iteration SKILL 那句身處 negation-window 校準過的複合句內（'never rings' 是 window 取捨的已驗證輸入之一），為 Suggestion 級 DRY 改動它會擾動剛驗證的測試取捨——風險大於收益。re-review signal：若未來任一處理由句被修改，另一處需同步（owner: 修改者；下次觸碰這兩檔任一 rule/bullet 時檢查）。"

