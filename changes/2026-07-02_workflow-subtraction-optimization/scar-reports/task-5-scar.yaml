resolved_items:
  - original_section: "assumptions_made (self-iteration)"
    original_description: >
      Initial draft of two Transition-section literal-phrase unit-test
      checks ("not a calibrated constant", the Auto Mode Gate
      "deterministic default-skip never invokes this gate" phrase) were
      written as exact single-string `in` checks, but the actual doc's
      natural markdown line-wrap split these phrases across a
      newline+indent — a formatting artifact that would have silently
      reddened the unit tests on the very first harmless rewrap, which is
      an over-fit (brittleness) violation of the Test Contract Gate.
    resolution: >
      Added a `_normalize_ws` helper (collapses whitespace runs including
      wrap newlines to a single space) and applied it before these two
      multi-word phrase checks; the clause-bounded proximity predicates
      (death tests) were left untouched since their real-doc phrases stay
      on one physical line by construction and newline-exclusion is
      intentional there (project test lesson: boundary bleed). Verified by
      re-running tests/test_skills/test_iteration_entry_criteria.py (all
      14 tests green) and the full suite (843 passed).

  - original_section: "process order (self-iteration correction)"
    original_description: >
      The implementer initially wrote the doc changes to skills/implement/
      SKILL.md and skills/iteration/SKILL.md BEFORE writing the death
      tests against them, violating the mandatory "death test before
      implementation" order (the tests were written afterward, against an
      already-passing target, so they were never actually observed red).
    resolution: >
      Backed up both files, mechanically reverted every task-5-specific
      edit (leaving prior tasks' 1-4 uncommitted changes intact) using the
      exact old_string/new_string pairs from the edit history, re-ran
      tests/test_skills/test_iteration_entry_criteria.py against the
      reverted (pre-task-5) doc state, and confirmed 9 of 14 tests went
      RED (yin review reproduced and corrected the internal breakdown: 2
      death tests on missing new clauses + 1 death test firing on the
      still-present legacy phrase = 3 death-test reds, plus 6 unit tests
      failing on missing new sections/content) with the 5 permanent decoy
      sanity tests staying green throughout (as expected, since they test
      hardcoded fixture strings, not the doc). Then restored both files
      from the backup and re-ran the full suite to confirm 843 passed / 0
      failed with the actual implementation in place.

