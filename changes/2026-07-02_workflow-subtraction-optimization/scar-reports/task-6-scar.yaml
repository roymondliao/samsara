silent_failure_conditions:
  - description: >
      Nothing in this repo enforces at write time that `reviewed_criteria`
      lists the criteria that were ACTUALLY checked rather than a copy-pasted
      full list ([C5, C6, C7, C8]) written reflexively regardless of what was
      reviewed. The DC7 death case this task targets (empty violations list
      indistinguishable from "never reviewed") is closed by the forbidding
      clause added to SKILL.md; a DIFFERENT, narrower gap — reviewed_criteria
      present but inaccurate — is not closed and is not in this task's scope
      (see known_shortcuts systemic_ref above; the two are the same
      underlying doc-vs-runtime-obedience fact, not a separate shortcut).
    deferred_to_feature_iteration: true
    # Fixing this requires either code-level audit tooling (e.g. a script
    # that samples changes/*/fast-track.yaml over time for a
    # near-100%-empty-violations pattern) or reverting to explicit
    # per-criterion checkboxes — both are architectural decisions and/or new
    # files outside this task's scope ("只動 skills/fast-track/ 下的兩個檔＋
    # 新測試檔"). The kickoff-recorded death condition (known_shortcuts above)
    # already names when to revisit this.

  - description: >
