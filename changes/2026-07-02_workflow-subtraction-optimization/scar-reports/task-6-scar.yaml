narrative: |
  Design choice not built (Structural Honesty — say the refusal out loud):
  SKILL.md's Output section example for `quality_review` was reduced to a
  2-line minimal shape (`reviewed_criteria: [C5, C6, C7, C8]` /
  `violations: []`) with a comment pointing to templates/fast-track.yaml as
  the canonical field shape, rather than fully re-stating the field's
  comments/rationale a second time. templates/fast-track.yaml is the
  canonical source (it is the file actually written by an implementer each
  fast-track run); SKILL.md's Output section only needs to show the reader
  the SHAPE, not re-explain every field's semantics a second time — this
  feature has already caught the "same contract fully restated in two
  places" trap five times per the Additional Context, and this task
  deliberately avoids adding a sixth instance for the quality_review field
  specifically (the OTHER fields in that same Output example — type,
  description, death_clause, acceptance, scar_tag, scar_items,
  files_changed — remain duplicated between SKILL.md and the template as
  they were before this task; fixing that pre-existing duplication is out of
  this task's scope, which is limited to the quality_checklist ->
  quality_review swap).

  Two facts intentionally kept in two different places, not one fact
  duplicated: SKILL.md Step 4's "Recording the review" paragraph documents
  HOW to fill the field (mechanics, for a reader following Step 4 prose
  without opening the template); the Yin-Side Constraints "Quality symmetry"
  bullet documents WHY it is mandatory (the guard against an incomplete
  review). Both mention `reviewed_criteria`/`violations` by name because
  each needs to reference the field to state its own distinct fact, not
  because the same fact is restated twice.

  Test suite: 843 passed (baseline, unchanged going in) -> 856 passed (843 +
  13 new tests in tests/test_skills/test_fast_track_quality_review.py), 0
  failed, 0 errors. Zero regressions in any pre-existing test. Death tests
  were verified red by reverting skills/fast-track/SKILL.md and
  templates/fast-track.yaml to their pre-task-6 content via `git stash` (5 of
  13 tests went red against the reverted files: 2 of the 3 real-file death
  tests — forbidding clause absent, `quality_review` structure not yet
  present in either the template or the Output example — plus all 3
  real-file unit tests asserting that same absent structure; the 3rd death
  test, guarding the pre-existing "Quality symmetry" bullet, correctly
  stayed green against the reverted file since that bullet already existed
  pre-task-6 and this task only extends its wording, it does not introduce
  it), then restoring via `git stash pop` and re-running to confirm all 13
  green with the implementation in place.
