silent_failure_conditions:
  - description: ".samsara/systemic-scars.yaml was git-ignored by the pre-existing blanket '.samsara' rule ('kept locally, not shipped') — every git add/commit and every fresh clone would silently have NO registry file, degrading all systemic_ref items to the 'registry missing -> unknown' path project-wide with no error."
    status: resolved
    resolution: "Rewrote .gitignore: '.samsara' -> '.samsara/*' plus an explicit '!.samsara/systemic-scars.yaml' negation (a bare directory-ignore cannot be undone by negation; the entry rule had to change shape first). Added test_death__systemic_scars_registry_is_not_gitignored, verified red-before/green-after via git stash on .gitignore alone."

  - description: "When a feature's Level 2 `iteration` is skipped (Transition option B: skip straight to Security & Privacy Review), a dangling systemic_ref in any task's scar report is never resolved or reported by anything — validate-and-ship / ship-manifest.md do not run systemic_ref resolution. The dangling ref silently persists uncaught for that feature."
    deferred_to_feature_iteration: true

  - description: "skills/iteration/SKILL.md:79 (Parse failure handling, a sentence I appended to in this task) listed 'old plain-string format' as an example of a non-conforming scar report to treat as a parse failure — directly contradicting Rule 8 (plain string known_shortcuts/silent_failure_conditions is a VALID format that must be counted normally, never treated as a parse failure). Had this shipped, an agent following the literal instruction would silently exclude valid old-format items from signal_lost — the exact DC3 failure mode this task exists to prevent."
    status: resolved
    resolution: "Reworded skills/iteration/SKILL.md:79 to remove 'old plain-string format' from the parse-failure example list and added an inline note pointing to Rule 8's requirement to count it normally. 'markdown format instead of YAML' is now the sole non-conforming example. Added test_death__iteration_parse_failure_example_does_not_contradict_rule_8 as a regression guard (verified red on the pre-fix sentence, green after)."

  - description: "The regression guard added for the item above (test_death__iteration_parse_failure_example_does_not_contradict_rule_8) gated its assertion behind 'if plain-string in sentence:' — a keyword-triggered check that vacuously passes if a future edit reintroduces the same contradiction under different wording (e.g. 'legacy string format') that does not contain the trigger substring. Caught by quality review, referred to yin. The follow-up fix (unconditional re.search(r'not\\b.{0,60}plain[- ]string.{0,100}rule 8', ...)) had a SECOND gap caught by yin mutation testing: (a) presence-not-polarity — an unrelated 'does NOT conform' earlier in the sentence satisfied the loose 'not' trigger; (b) boundary bleed — the 100-char DOTALL window crossed clause boundaries, so a decoy citing '... per Rule 8' to justify treating plain-string AS a parse failure ('(treat old plain-string format as a parse failure per Rule 8)') still matched and stayed green. The round-2/round-3 resolutions for this item OVERSTATED verification (claimed the check was fixed but never tried a wrong-direction decoy that reintroduces the bug under the SAME keywords)."
    status: resolved
    resolution: "Extracted the assertion into _step1_declares_plain_string_exclusion(sentence), requiring BOTH: (a) the verbatim adjacent anchor 'not the old plain-string' (rejects a distant unrelated 'not'), AND (b) 'rule 8' followed, within a clause-bounded gap ([^.!?\\n]{0,40}, not DOTALL) by an actual claim (count/normally/never treat...parse failure) — rejects a decoy that cites Rule 8 to justify the opposite claim. Baked yin's exact reintroduction mutation into the suite permanently as _PLAIN_STRING_REINTRODUCTION_DECOY plus test_death__plain_string_reintroduction_decoy_is_detected (asserts the SAME function reports the decoy's claim as missing). Also re-verified against the real file via temp-swap (not committed): production test went RED on yin's exact mutation applied to skills/iteration/SKILL.md, GREEN after revert."

