narrative: |
  Execution-order deviation: I implemented all four modified doc files
  (scar-schema.yaml, iteration/SKILL.md, implementer.md, scar-report.md)
  before writing the death test file, breaking death-test-first ordering by
  mistake (doc edits and test-writing should have swapped). I did not
  re-order retroactively; instead I verified genuine red-before-green for
  every death/unit test by `git stash push -- <the 4 modified doc files>` (and
  separately `.gitignore`), running the new test file against the pre-edit
  content (7 of 12 went red as expected; the 3 implementer.md regression
  guards and the registry-shape unit test stayed green because they guard
  content this task never touched), then `git stash pop` to restore. This is
  recorded because a reviewer re-deriving "was this really red first" from the
  diff alone cannot see it — the git-stash step is not visible in the final
  file state.
