known_shortcuts:
  - description: >
      Line-count budget vs. the "≤8 行" formal cap named in the task's Key
      Decisions: actual pointer-section content-line counts (non-blank
      lines inside "## Auto Mode Gate") are research=11, planning=11,
      pre-thinking=15, implement=18, iteration=18, validate-and-ship=48.
      Only research/planning come close to "≤8"; all six exceed it once
      the formal cap is read literally. Each overage is a stage genuinely
      needing more than one line to name its workflow_prompt source(s) and
      decision-point list (pre-thinking has 3 prompt groups; implement has
      2 workflow_prompt sources + inline execution-strategy semantics;
      iteration enumerates 4 decision points; validate-and-ship keeps the
      Step 0 auto-overrides list + the double decision-trace check inline,
      per the task's own "階段特異行為必須 inline 保留" instruction). Recorded
      per the task's explicit request, not because it is unresolved debt —
      the task itself anticipated validate-and-ship exceeding the cap
      ("它的指針段預期超過 8 行上限，記錄實際行數與理由即可").

  - description: >
      Canonical increment vs. skills decrement (task acceptance criteria
      "canonical 增量必須遠小於 skills 減量"): measuring the "## Auto Mode Gate"
      section body (raw lines, same `section()` helper both sides) before
      and after this task: research 22->16, pre-thinking 24->18,
      planning 23->16, implement 30->21, iteration 35->21,
      validate-and-ship 61->57. Total across the 6 skills: 195 -> 149
      (-46 raw lines). references/auto-mode.md's new "## Stage Gate
      Protocol" section adds 27 raw lines. Net across the whole feature:
      -19 raw lines (a real reduction, not a wash) — but the canonical
      increment (27) is the majority (~59%) of the skills' decrement (46),
      not "far smaller" in a strict ratio sense. The gap is real
      *added* content, not moved text: no single one of the 6 skills
      previously spelled out the dispatch mechanism, append-before-continue
      timing, or the four decision values' general meaning as
      explicitly as the new canonical section does — every skill's old
      section only said "route through the gatekeeper... follow
      proceed/revise/reject/accept_gap" without defining what those verbs
      mean for the calling workflow. That definition had to be written
      somewhere once; it did not exist compressed anywhere before. Trimmed
      the canonical section twice during implementation (46 -> 31 -> 27
      raw lines) after the first draft over-explained; did not trim
      further because the remaining content is exactly the two
      concrete-force items the task asked for (dispatch + decision-value
      semantics), not filler.

  - description: >
      validate-and-ship's Step 0 body (lines 64-113, NOT edited by this
      task) and its Auto Mode Gate's "Step 0 auto overrides" list still
      state overlapping facts (e.g. both say "unknown is never a pass").
      This is the task-3-deferred item ("Step 0 本文與 Auto Gate 段重述").
      What THIS task fixed: the genuine duplicate-of-duplicate inside the
      Auto Mode Gate section itself — a standalone paragraph
      ("If review capability is absent, review result is unknown...")
      that restated the 6-item override bullet list immediately above it,
      word for word in prose form — was deleted; its two required literal
