resolved_items:
  - original_section: "silent_failure_conditions (self-iteration)"
    original_description: >
      Initial anti-duplication death test predicate only matched ONE
      canonical decision-value definition verbatim (`revise`), so a skill
      re-embedding only the `proceed`, `reject`, or `accept_gap` canonical
      text (without also copying `revise`'s exact wording) would not have
      been caught, even though the task explicitly asks to guard against
      re-embedding "任一" (ANY) of the 4 decision-value definitions.
    resolution: >
      Broadened `reembeds_canonical_decision_definitions` in
      tests/test_auto_mode/test_skill_auto_mode_protocol_death.py to check
      all 4 canonical decision-value definitions
      (_CANONICAL_DECISION_DEFINITIONS tuple, one verbatim marker per
      value) via `any()`, not just `revise`. Verified by injecting the
      `accept_gap` canonical phrase (not `revise`) into a live skill file
      and confirming the death test caught it, then restoring the file
      (diff-confirmed clean) and re-running the full suite (829 passed).

  - original_section: "known_shortcuts (found during implementation, not deferred)"
    original_description: >
      Three literal test-required phrases were accidentally split across a
      markdown line-wrap while writing the pointer sections:
      "Subagent parallel" (implement), "must not proceed past Step 0" and
      "invalid in auto mode" (validate-and-ship) — each phrase's exact
      substring was broken by a newline+indent landing mid-phrase, which
      would have silently reddened tests/test_skills/
      test_security_gate_fold.py and this task's own protocol tests without
      any content actually being wrong (a formatting artifact, not a
      semantic gap).
    resolution: >
      Re-wrapped each line so the load-bearing exact phrase stays on one
      physical line (skills/implement/SKILL.md:248-250,
      skills/validate-and-ship/SKILL.md:209-214). Verified via
      `grep -n "Subagent parallel"` / `grep -n "must not proceed past Step 0"`
      / `grep -n "invalid in auto mode"` each now match on a single line;
      full suite re-run green (829 passed) after the fix.

