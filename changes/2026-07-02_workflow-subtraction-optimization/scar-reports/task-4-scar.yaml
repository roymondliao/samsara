      SOLE place that states the auto-mode decision VALUE per case. What
      this task did NOT fully eliminate: Step 0's body text still
      generally describes what "unknown" and "fail" mean (needed for
      human-in-the-loop mode, and pinned by tests/test_skills/
      test_security_gate_fold.py's DC2/DC3, which is outside this task's
      Files list). Fully collapsing that remaining overlap would require
      rewording Step 0's body prose itself — out of this task's declared
      scope (Files list only names the 6 skills' "Auto Mode Gate"
      sections and references/auto-mode.md) and risks reddening
      test_security_gate_fold.py's unrelated DC2/DC3 assertions for no
      requested benefit.
      FINAL DISPOSITION (quality review verdict, accepted by main agent):
      the residual triple-statement of "unknown != pass" (Step 0 body :85,
      Red Flags :108, Auto Gate overrides :209-211) is a DELIBERATE
      test-guarded belt-and-suspenders — test_security_gate_fold.py requires
