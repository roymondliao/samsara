silent_failure_conditions:
  - systemic_ref: doc-vs-runtime-obedience
    note: >
      Every one of the 6 pointer sections assumes the executing agent
      actually opens references/auto-mode.md's Stage Gate Protocol before
      dispatching the gatekeeper; nothing in this repo enforces that a
      session reads the referenced file. skills/*/SKILL.md Auto Mode Gate
      sections (all 6), references/auto-mode.md Stage Gate Protocol.

  - description: >
      The new anti-duplication death test
      (test_death__no_skill_reembeds_canonical_decision_definitions in
      tests/test_auto_mode/test_skill_auto_mode_protocol_death.py) matches
      4 VERBATIM substrings, one per canonical decision value. A
      paraphrased re-embedding (same meaning, different words) of the
      canonical definitions into a skill's own section would not be
      caught — only an exact-text copy-paste regrowth is guarded. This is
      the same doc-vs-runtime-obedience-adjacent limit as any grep-based
      doc-contract test: it proves absence of the LITERAL string, not
      absence of the underlying duplication in different words.
      HONESTY CORRECTION (review round): this was NOT hypothetical — yin
      review proved a live instance had already shipped in this very diff
      (the byte-identical "`reject` stops the auto run" clause in 5 skills,
      green under the anti-dup test). The 5 residue lines were deleted
      inline by the main agent (canonical already covers reject); the
      test's limitation itself remains accepted — the durable guard is
      deleting residue when found, not paraphrase-matching regex.
    status: resolved
    resolution: "5 處偽特異 reject 殘留刪除＋research revise 動詞修正＋行數預算收緊至 actual+1（iteration 22→19、v&s 50→49）；829 tests 綠"

