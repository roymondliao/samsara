known_shortcuts:
  - description: >
      293-line standalone security-privacy-review/SKILL.md compressed the
      per-decision execution-mode routing boilerplate into ONE shared
      routing block at the end of Step 0 (validate-and-ship/SKILL.md), instead
      of repeating a full "If human-in-the-loop... If auto..." pair after each
      decision point the way the original skill did. The 6 decision points
      merged this way: (1) empty-diff / cannot-determine-base-branch edge
      case, (2) capability-absent gate, (3) fail-result issue-selection,
      (4) unknown-result handling, (5) fix-loop issue selection, (6) safety
      valve at round >=3. All 6 semantics are still individually named in
      Step 0's body text (each has its own bullet/paragraph); only the
      repeated routing SENTENCE PAIR was deduplicated. The Transition
      decision point (7th) kept its own separate routing block unchanged
      (already existed in validate-and-ship, untouched). Listed here per the
      task's explicit request so review can verify no semantic was lost in
      the merge, not because it is unresolved debt.

  - description: >
      Single-file inflation vs. total reduction: validate-and-ship/SKILL.md
      grew from 158 to 243 lines (+85, +54%) by absorbing Step 0. The two
      files it replaces totaled 158 + 293 = 451 lines; the new single file
      is 243 lines, a 208-line (-46%) total reduction. This is the expected
      shape of a fold-in (one file grows so a whole file can disappear) —
      recorded as the task explicitly asked for the actual before/after line
      counts, not because 243 lines is itself a problem.

