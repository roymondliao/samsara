silent_failure_conditions:
  - description: >
      Section 8's superseded items (former "成熟度" classification, former
      "輕想/深想分界" resolution) are marked in place with rationale rather
      than deleted outright — this preserves the collapse-trace principle
      (§4 principle 4: "留下收斂痕跡"). A future reader who skims only bullet
      titles (not the parenthetical) could still misread these as live
      mechanisms and re-introduce "成熟度" or "輕想" into the formal
      skills/pre-thinking/ rewrite. No linter enforces this on a markdown
      design doc — the only guard is a human reading the full sentence.
    status: resolved
    resolution: >
      Self-iteration: reworded both bullet leads from an easy-to-skim-past
      "(已解決,後由 2026-07-04 修訂取代)" parenthetical to a bracketed,
      bolded, front-loaded marker — "**〔已被 2026-07-04 修訂取代刪除,非現行
      機制〕**" — placed immediately after the bullet's bold title so it is
      visible even on a title-only skim
      (changes/2026-06-13_pre-thinking-dynamic-redesign/0-design-direction.md:325,335).
      This narrows but does not eliminate the risk (still no mechanical
      enforcement) — the residual risk is unresolved and left as-is, not
      deferred (no further in-scope action exists for a markdown-only file
      per this task's Death Test Requirements).

