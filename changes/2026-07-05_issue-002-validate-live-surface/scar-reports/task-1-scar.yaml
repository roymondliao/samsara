known_shortcuts:
  - description: >
      Live-surface exclusion (_LIVE_SURFACE_EXCLUDED_TOP_LEVEL_DIRS) matches
      by exact top-level path SEGMENT via string equality (relative.parts[0]
      in the frozenset), not resolved path identity. A symlink whose target
      escapes the excluded subtree, or an excluded top-level name that is
      itself a symlink pointing at a live-surface path, is not specially
      detected — the check only inspects the syntactic first segment under
      output_dir. Accepted because the exclusion targets a small, fixed,
      repo-controlled set of top-level names, not arbitrary/untrusted input;
      no symlink currently exists at any of the four excluded top-level
