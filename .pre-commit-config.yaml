default_language_version:
    python: python3.14

exclude: |
  (?x)(
    .*uv.lock |
    .*_static |
    .*ipynb |
    ^data/
  )

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: detect-aws-credentials
      args: [--allow-missing-credentials]
    - id: detect-private-key
    - id: name-tests-test
      args: ['--pytest-test-first']
      # Leading-underscore modules under tests/ are shared helpers, not test
      # files (e.g. tests/test_contract_bound_tests/_contract_tokens.py, the
      # single canonical concept-token source imported by sibling evaluators).
      exclude: ^tests/test_contract_bound_tests/_[^/]+\.py$
    - id: check-merge-conflict
    - id: check-added-large-files
      args: ['--maxkb=50000']
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.5
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.15.0
  hooks:
    - id: mypy
      name: mypy (project modules)
      args:
        - --namespace-packages
        - --explicit-package-bases
        - --disallow-untyped-defs
        - --ignore-missing-imports
      # Hyphenated skill directories are valid skill IDs but invalid Python
      # package components. Check their standalone validators in isolated hooks
      # below so mypy does not collapse both paths into module `validate_format`.
      exclude: ^(tests/|skills/(fast-track|validate-and-ship)/scripts/validate_format\.py$)
      additional_dependencies:
        - pydantic>=2.12.5
        - wandb
        - types-PyYAML
        - PyYAML
    - id: mypy
      name: mypy (fast-track validator)
      args:
        - --namespace-packages
        - --explicit-package-bases
        - --disallow-untyped-defs
        - --ignore-missing-imports
      files: ^skills/fast-track/scripts/validate_format\.py$
      additional_dependencies:
        - pydantic>=2.12.5
        - wandb
        - types-PyYAML
        - PyYAML
    - id: mypy
      name: mypy (validate-and-ship validator)
      args:
        - --namespace-packages
        - --explicit-package-bases
        - --disallow-untyped-defs
        - --ignore-missing-imports
      files: ^skills/validate-and-ship/scripts/validate_format\.py$
      additional_dependencies:
        - pydantic>=2.12.5
        - wandb
        - types-PyYAML
        - PyYAML
- repo: https://github.com/pappasam/toml-sort
  rev: v0.24.2
  hooks:
    - id: toml-sort-fix
